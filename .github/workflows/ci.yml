name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: licitall
          POSTGRES_PASSWORD: licitall
          POSTGRES_DB: licitall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licitall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://licitall:licitall@localhost:5432/licitall
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.txt -c requirements.lock
      - run: pytest tests -q
