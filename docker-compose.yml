# LicitAll — serviços locais de infraestrutura
# Uso: docker compose up -d
#
# Portas no host (ajuste via .env se houver conflito com outros projetos):
#   ${LICITALL_POSTGRES_PORT:-5433}  PostgreSQL 16 + pgvector
#   ${LICITALL_REDIS_PORT:-6380}      Redis
#   8001                             Minha Receita (consulta CNPJ)
#   ${LICITALL_EVOLUTION_PORT:-8081}  Evolution API (WhatsApp)
#   ${LICITALL_EVOLUTION_UI_PORT:-3001} Evolution Manager (QR)
#
# Todas as portas acima ficam presas a 127.0.0.1 (não ficam expostas na rede).
#
# Desenvolvimento: a API roda fora do Compose: uvicorn src.main:app --reload --port 8000
# Produção (perfil "app"): docker compose --profile app up -d --build
#   api   -> a aplicação (porta 8000 só na rede interna), aplica as migrações ao subir
#   proxy -> Caddy com HTTPS automático nas portas ${HTTP_PORT:-80} e ${HTTPS_PORT:-443}
# Guia completo: docs/usuario/OPERACAO_DOCKER.md

name: licitall

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: licitall-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LICITALL_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licitall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitall}
      POSTGRES_DB: ${POSTGRES_DB:-licitall}
    volumes:
      - licitall_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitall} -d ${POSTGRES_DB:-licitall}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - licitall

  redis:
    image: redis:7-alpine
    container_name: licitall-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LICITALL_REDIS_PORT:-6380}:6379"
    volumes:
      - licitall_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - licitall

  minha-receita:
    profiles: ["full"]
    image: atcr.io/cuducos.me/minha-receita:latest
    container_name: licitall-minha-receita
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER:-licitall}:${POSTGRES_PASSWORD:-licitall}@postgres:5432/minhareceita?sslmode=disable
    volumes:
      - ./data/minha-receita:/mnt/data
    # Imagem distroless: sem shell/curl para healthcheck HTTP.
    networks:
      - licitall

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: licitall-evolution-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LICITALL_EVOLUTION_PORT:-8081}:8080"
    env_file:
      - ./docker/evolution.env
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-licitall-dev-evolution-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-licitall}:${POSTGRES_PASSWORD:-licitall}@postgres:5432/evolution?schema=evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - licitall

  evolution-frontend:
    image: evoapicloud/evolution-manager:latest
    container_name: licitall-evolution-frontend
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      - "127.0.0.1:${LICITALL_EVOLUTION_UI_PORT:-3001}:80"
    networks:
      - licitall

  api:
    profiles: ["app"]
    build:
      context: .
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    image: licitall-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Em produção a API RECUSA subir com senha/chave padrão, DEBUG ligado ou cookie sem HTTPS.
      APP_ENV: ${APP_ENV:-production}
      AUTO_CREATE_TABLES: "false"
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-licitall}:${POSTGRES_PASSWORD:-licitall}@postgres:5432/${POSTGRES_DB:-licitall}
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-licitall-dev-evolution-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-licitall}
      # Padrão: serviço local (perfil "full", exige ETL). Sem ele, use a API pública: https://minhareceita.org
      MINHA_RECEITA_BASE_URL: ${MINHA_RECEITA_PROD_URL:-http://minha-receita:8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Embeddings do casamento semântico e do ramo por significado (sem chave: modo local "hash", não semântico)
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_REGISTRATION_OPEN: ${AUTH_REGISTRATION_OPEN:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # A API só é alcançável pelo proxy (rede interna), então confia nos cabeçalhos dele (IP real do cliente).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - licitall_data:/app/data
    networks:
      - licitall

  proxy:
    profiles: ["app"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - licitall

volumes:
  licitall_pgdata:
  licitall_redis:
  licitall_data:
  caddy_data:
  caddy_config:
  evolution_instances:

networks:
  licitall:
    name: licitall
    driver: bridge
